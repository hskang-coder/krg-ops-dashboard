<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRG 업무 메뉴얼 — 내 업무 · 흐름 · 작업지시서</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F9FAFB;--text:#111827;--sub:#6B7280;--line:#E5E7EB;--ok:#10B981}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
button{font-family:inherit}
/* ── nav ── */
nav{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--line);
  padding:0 16px;display:flex;align-items:center;gap:8px;height:54px}
.nav-logo{font-size:16px;font-weight:900;margin-right:6px;white-space:nowrap}
.tabs{display:flex;gap:4px;background:#F3F4F6;border-radius:12px;padding:4px}
.tab{border:none;background:transparent;padding:7px 14px;border-radius:9px;font-size:13px;font-weight:700;
  color:var(--sub);cursor:pointer;white-space:nowrap}
.tab.on{background:#111827;color:#fff}
.nav-r{margin-left:auto;font-size:12px;color:var(--sub);white-space:nowrap}
/* ── hero ── */
.hero{background:linear-gradient(135deg,#1E3A5F 0%,#3B82F6 100%);padding:28px 20px 24px;text-align:center;color:#fff}
.hero h1{font-size:clamp(20px,4vw,30px);font-weight:900;margin-bottom:6px}
.hero p{font-size:14px;opacity:.9;max-width:640px;margin:0 auto}
.view{display:none;max-width:1200px;margin:0 auto;padding:22px 16px 60px}
.view.on{display:block}
/* ── chips ── */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:14px;
  font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.chip.on{background:#111827;color:#fff;border-color:#111827}
.chip .av{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;background:#E5E7EB;color:#374151}
.chip.on .av{background:#fff;color:#111827}
.achip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:99px;font-size:12px;
  font-weight:700;color:#fff;text-decoration:none;cursor:pointer;border:none}
/* ── 내 업무 ── */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.sum .s{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sum .s b{font-size:22px;font-weight:900;display:block}
.sum .s span{font-size:12px;color:var(--sub)}
.grp{background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px 16px 8px;margin-bottom:14px}
.grp h3{font-size:15px;font-weight:800;padding:10px 0 6px;display:flex;align-items:center;gap:8px}
.grp h3 small{font-weight:600;color:var(--sub);font-size:12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid #F3F4F6;cursor:pointer;border-radius:8px}
.row:hover{background:#F9FAFB}
.row .tm{font-size:12px;font-weight:800;color:#374151;min-width:62px;text-align:center;background:#F3F4F6;
  border-radius:8px;padding:5px 4px}
.row .em{font-size:22px;width:30px;text-align:center}
.row .nm{font-size:14px;font-weight:700;flex:1;min-width:0}
.row .nm small{display:block;font-weight:600;color:var(--sub);font-size:11px;margin-top:2px}
.row .ac{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.row .dn{font-size:11px;font-weight:800;color:#065F46;background:#D1FAE5;border-radius:99px;padding:3px 8px;white-space:nowrap}
.empty{padding:22px;text-align:center;color:var(--sub);font-size:13px}
</style>
<style>
/* ── 흐름 ── */
.fa{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:18px}
.fa-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.fa-h .fe{font-size:32px}
.fa-h h2{font-size:18px;font-weight:900}
.fa-h p{font-size:13px;color:var(--sub);margin-top:2px}
.fa-lane{font-size:12px;font-weight:800;color:var(--sub);margin:12px 0 6px}
.fw{overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin}
.flow{display:flex;align-items:stretch;gap:0;min-width:max-content}
.stg{width:176px;background:#F9FAFB;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.stg-t{font-size:12px;font-weight:900;color:#fff;border-radius:8px;padding:5px 8px;display:inline-block;align-self:flex-start}
.stg-s{font-size:11px;color:var(--sub);margin-top:-2px}
.tchip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:6px 8px;font-size:12px;font-weight:700;cursor:pointer;line-height:1.3;text-align:left}
.tchip:hover{border-color:#111827}
.tchip .d{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.arr{display:flex;align-items:center;padding:0 4px;color:#9CA3AF;font-size:20px;flex-shrink:0}
.fork{width:auto;border-style:dashed;background:#fff}
.fork-q{font-size:12px;font-weight:900;color:#111827;background:#FEF3C7;border-radius:8px;padding:5px 8px;align-self:flex-start}
.opts{display:flex;gap:8px}
.opt{background:#F9FAFB;border:1px solid var(--line);border-radius:10px;padding:8px;width:160px;display:flex;flex-direction:column;gap:6px}
.opt-l{font-size:11px;font-weight:900;border-radius:6px;padding:3px 7px;align-self:flex-start}
.opt-note{font-size:11px;color:#374151;line-height:1.4}
.side{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.side .tchip{display:inline-flex}
.jump{align-self:center;background:#fff;border:1px dashed #9CA3AF;color:#374151;border-radius:12px;padding:10px 12px;
  font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
/* ── 전체 카드 ── */
.section{margin-bottom:34px}
.section-header{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding:16px 20px;border-radius:18px;color:#fff}
.area-emoji{font-size:40px}
.area-info h2{font-size:19px;font-weight:800}
.area-info p{font-size:13px;opacity:.9;margin-top:3px}
.area-count{margin-left:auto;background:rgba(255,255,255,.25);border-radius:12px;padding:6px 14px;font-size:22px;font-weight:900}
.task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.task-card{background:#fff;border-radius:16px;padding:16px;border:1px solid var(--line);cursor:pointer;position:relative;
  transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:9px}
.task-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.task-card .hint{position:absolute;top:10px;right:10px;font-size:10px;font-weight:800;padding:3px 7px;border-radius:99px;background:#111827;color:#fff}
.task-icon{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:27px}
.task-name{font-size:14px;font-weight:700;line-height:1.4}
.task-badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{display:inline-flex;align-items:center;gap:2px;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:600}
.bp{background:#EFF6FF;color:#1D4ED8}.bd{background:#F3F4F6;color:#374151}.bo{background:#FFF7ED;color:#92400E}
.ba{background:#D1FAE5;color:#065F46}.bm{background:#FEF3C7;color:#92400E}.bt{background:#DBEAFE;color:#1E40AF}
.be{background:#F3F4F6;color:#9CA3AF}.bmin{background:#F5F3FF;color:#5B21B6}
.legend{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:10px}
.legend h3{font-size:15px;font-weight:800;margin-bottom:10px}
.legend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
</style>
<style>
/* ── 작업지시서 모달 ── */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.55);backdrop-filter:blur(3px);z-index:1000;display:none;
  align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.md{background:#fff;border-radius:22px;max-width:680px;width:100%;max-height:92vh;overflow:hidden;display:flex;
  flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.3);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.md-h{padding:20px 22px;color:#fff;display:flex;gap:14px;align-items:center;position:relative;flex-shrink:0}
.md-h .big{font-size:44px;width:72px;height:72px;border-radius:18px;background:rgba(255,255,255,.2);display:flex;
  align-items:center;justify-content:center;flex-shrink:0}
.md-h h3{font-size:19px;font-weight:900;line-height:1.3;padding-right:36px}
.md-h .area{font-size:12px;opacity:.85;margin-bottom:3px}
.md-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:none;
  background:rgba(255,255,255,.25);color:#fff;font-size:22px;cursor:pointer;line-height:1}
.md-b{padding:16px 22px 22px;overflow-y:auto}
.md-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.md-badges .badge{font-size:12px;padding:5px 10px}
.why{background:#F9FAFB;border-left:4px solid #111827;border-radius:0 10px 10px 0;padding:10px 12px;font-size:14px;
  line-height:1.5;margin-bottom:16px}
.sec{margin-bottom:16px}
.sec h4{font-size:14px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.sec h4 .pct{font-size:12px;color:var(--sub);font-weight:700}
.prog{height:8px;background:#F3F4F6;border-radius:4px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.ck{list-style:none;display:flex;flex-direction:column;gap:4px}
.ck .gh{font-size:13px;font-weight:800;color:#374151;margin:8px 0 2px;display:flex;align-items:center;gap:8px}
.ck .gh .num{width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;display:inline-flex;
  align-items:center;justify-content:center}
.ck label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:14px;line-height:1.5}
.ck label:hover{background:#F9FAFB}
.ck label.sub{margin-left:22px;font-size:13px}
.ck input{appearance:none;width:20px;height:20px;border:2px solid #D1D5DB;border-radius:6px;flex-shrink:0;margin-top:2px;
  cursor:pointer;position:relative;background:#fff}
.ck input:checked{background:var(--ok);border-color:var(--ok)}
.ck input:checked::after{content:'';position:absolute;left:5px;top:1px;width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.ck input:checked+span{color:#9CA3AF;text-decoration:line-through}
.lnk{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:12px;background:#EFF6FF;color:#1D4ED8;
  font-size:13px;font-weight:700;text-decoration:none;margin:0 6px 6px 0}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.img{cursor:zoom-in;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#F9FAFB}
.img img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.img figcaption{font-size:11px;color:#374151;padding:6px 8px;line-height:1.4}
.wb{border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.5;margin-bottom:8px}
.wb-done{background:#D1FAE5;border:1px solid #6EE7B7;color:#064E3B;font-weight:700}
.wb-warn{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B}
.wb-tip{background:#FFFBEB;border:1px solid #FCD34D;color:#92400E}
.help{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:#374151}
.help b{background:#F3F4F6;border-radius:8px;padding:4px 10px}
.nextbtn{width:100%;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:800;color:#fff;cursor:pointer;margin-top:4px}
.md-f{padding:10px 22px;border-top:1px solid var(--line);font-size:12px;color:var(--sub);display:flex;
  justify-content:space-between;align-items:center;gap:10px;flex-shrink:0}
.md-f a,.md-f button{color:#1D4ED8;font-weight:700;text-decoration:none;background:none;border:none;cursor:pointer;font-size:12px;white-space:nowrap}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1100;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:96vw;max-height:84vh;border-radius:8px}
.lb p{color:#fff;font-size:14px;margin-top:10px;text-align:center}
@media(max-width:600px){
  .hero{padding:20px 14px}.view{padding:14px 10px 50px}
  .row .tm{min-width:52px;font-size:11px}.task-grid{grid-template-columns:1fr 1fr}
  .md{max-height:94vh;border-radius:18px}.md-h{padding:16px}.md-h .big{width:56px;height:56px;font-size:32px}.md-b{padding:14px}
  .nav-r{display:none}.area-count{display:none}
}
</style>
</head>

/* ── 공통 ── */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const byName={}; A.forEach(a=>a.tasks.forEach(t=>{byName[t.n]={a,t}}));
const ac=a=>a==='자동'?'ba':a==='수동'?'bm':a==='자동화대상'?'bt':'be';
const al=a=>a==='자동'?'🤖 자동':a==='수동'?'👋 수동':a==='자동화대상'?'🎯 자동화 예정':'⏭ 제외';
const pl=p=>({사건별:'🕐 사건별',매일:'📅 매일',매주:'📆 매주',매월:'📇 매월'})[p]||'🕐 '+p;
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const LS={get(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const chkKey=()=>'krg_chk_'+todayKey();
/* 체크리스트 leaf 목록 */
function leaves(t){
  const d=D[t.n]; if(!d||!d.steps) return [{k:'0',txt:t.n+' 완료'}];
  const out=[]; d.steps.forEach((s,i)=>{ if(typeof s==='string') out.push({k:String(i),txt:s}); else (s.s||[]).forEach((x,j)=>out.push({k:i+'.'+j,txt:x,g:i})); });
  return out;
}
function doneState(t){ const st=LS.get(chkKey(),{})[t.n]||{}; const L=leaves(t); const n=L.filter(l=>st[l.k]).length; return {n,total:L.length,all:n===L.length&&L.length>0}; }
const badges=t=>`<span class="badge bp">${pl(t.p)}</span><span class="badge bd">⏰ ${esc(t.d)}</span><span class="badge bo">👤 ${esc(t.o)}</span><span class="badge ${ac(t.a)}">${al(t.a)}</span>${t.m?`<span class="badge bmin">⏱ ${t.m}분</span>`:''}`;

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));

  LS.set('krg_tab',b.dataset.v); window.scrollTo({top:0});
});

const PEOPLE=['고송미','이지희','오진선','김영철','강휘수','김준영','시스템'];
const timeVal=d=>{const m=d.match(/(\d{1,2}):(\d{2})/); if(m) return +m[1]*60+ +m[2]; if(/마감/.test(d)) return 1430; if(/방문 전/.test(d)) return 565; if(/자동/.test(d)) return 0; return 9999;};
const dueVal=d=>{const m=d.match(/D([+-])(\d+)/); if(m) return (m[1]==='-'?-1:1)*+m[2]; if(/확정|접수|신청/.test(d)) return -0.5; if(/\d+일/.test(d)) return 50; return 0;};
function renderWho(){
  const who=LS.get('krg_who','고송미');
  document.getElementById('who').innerHTML=PEOPLE.map(p=>`<button class="chip ${p===who?'on':''}" data-p="${p}"><span class="av">${p==='시스템'?'🤖':p[0]}</span>${p==='시스템'?'시스템(자동)':p}</button>`).join('');
  document.querySelectorAll('#who .chip').forEach(b=>b.onclick=()=>{LS.set('krg_who',b.dataset.p);renderWho();});
  renderMe(who);
}
function rowHtml(a,t,label){
  const ds=doneState(t);
  return `<div class="row" data-n="${esc(t.n)}">
    <span class="tm">${esc(label)}</span><span class="em">${t.e}</span>
    <span class="nm">${esc(t.n)}<small><span style="color:${a.color}">●</span> ${esc(a.name)}${t.m?' · ⏱ '+t.m+'분':''}${t.o!==LS.get('krg_who','')&&t.o!=='시스템'?' · 👤 '+esc(t.o):''}</small></span>
    ${ds.all?'<span class="dn">✓ 오늘 완료</span>':ds.n?`<span class="dn" style="background:#FEF3C7;color:#92400E">${ds.n}/${ds.total}</span>`:''}
    <span class="ac" style="background:${t.a==='자동'?'#10B981':t.a==='수동'?'#F59E0B':t.a==='자동화대상'?'#3B82F6':'#D1D5DB'}" title="${al(t.a)}"></span>
  </div>`;
}
function renderMe(who){
  const mine=[]; A.forEach(a=>a.tasks.forEach(t=>{ if(t.o===who||(who!=='시스템'&&t.o==='전원')) mine.push({a,t}); }));
  const daily=mine.filter(x=>x.t.p==='매일').sort((x,y)=>timeVal(x.t.d)-timeVal(y.t.d));
  const ev=mine.filter(x=>x.t.p==='사건별').sort((x,y)=>dueVal(x.t.d)-dueVal(y.t.d));
  const wk=mine.filter(x=>x.t.p==='매주'), mo=mine.filter(x=>x.t.p==='매월');
  const dd=daily.filter(x=>doneState(x.t).all).length;
  const mins=daily.reduce((s,x)=>s+(x.t.m||0),0);
  document.getElementById('sum').innerHTML=`
    <div class="s"><b>${daily.length}</b><span>매일 하는 일</span></div>
    <div class="s"><b style="color:#065F46">${dd} / ${daily.length}</b><span>오늘 완료</span></div>
    <div class="s"><b>${ev.length}</b><span>사건이 생기면</span></div>
    <div class="s"><b>${mins?'약 '+mins+'분':'-'}</b><span>매일 루틴 소요(추정)</span></div>`;
  const grp=(title,sub,list,lab)=>list.length?`<div class="grp"><h3>${title} <small>${sub}</small></h3>${list.map(x=>rowHtml(x.a,x.t,lab(x.t))).join('')}</div>`:'';
  document.getElementById('me-list').innerHTML=
    grp('📅 매일 루틴','시간순 — 위에서부터 차례로',daily,t=>t.d.replace('~','').replace(' 마감','').replace('자동 처리','자동'))+
    grp('🕐 사건이 생기면','계약·퇴실 등 일이 생길 때 — 기한 순',ev,t=>t.d)+
    grp('📆 매주',"",wk,t=>t.d)+grp('📇 매월',"",mo,t=>t.d)+
    (mine.length?'':'<div class="empty">이 담당자에게 배정된 업무가 없어요.</div>');
}
document.getElementById('me-list').addEventListener('click',e=>{const r=e.target.closest('.row'); if(r) openModal(r.dataset.n);});

const tchip=(n,color)=>{const x=byName[n]; if(!x){console.warn('unknown task',n);return ''} return `<button class="tchip" data-n="${esc(n)}"><span class="d" style="background:${color}"></span>${x.t.e} ${esc(n)}</button>`;};
function stageHtml(st,a){
  if(st.jump) return `<div class="arr">→</div><button class="jump" data-jump="${st.jump}">${esc(st.l)}</button>`;
  if(st.fork){
    return `<div class="arr">→</div><div class="stg fork"><div class="fork-q">❓ ${esc(st.fork.q)}</div><div class="opts">${st.fork.opts.map((o,i)=>`
      <div class="opt"><span class="opt-l" style="background:${['#D1FAE5','#FEF3C7','#FEE2E2','#DBEAFE'][i%4]};color:${['#065F46','#92400E','#991B1B','#1E40AF'][i%4]}">${esc(o.l)}</span>
      ${o.tasks?o.tasks.map(n=>tchip(n,a.color)).join(''):`<div class="opt-note">${esc(o.note)}</div>`}</div>`).join('')}</div></div>`;
  }
  return `<div class="arr">→</div><div class="stg"><span class="stg-t" style="background:${a.color}">${esc(st.t)}</span>${st.s?`<span class="stg-s">${esc(st.s)}</span>`:''}${st.tasks.map(n=>tchip(n,a.color)).join('')}</div>`;
}
function renderFlow(){
  const chips=A.map(a=>`<a class="achip" href="#f-${a.id}" style="background:${a.color}">${a.emoji} ${a.name.slice(3)}</a>`).join('');

  const x=byName[n]; if(!x) return; const {a,t}=x; const d=D[n]||{}; CUR=t;
  document.getElementById('mdh').style.background=a.bg;
  document.getElementById('mdi').textContent=t.e;
  document.getElementById('mda').textContent=a.emoji+' '+a.name;
  document.getElementById('mdt').textContent=t.n;
  document.getElementById('mdn').href=NOTION;
  const st=LS.get(chkKey(),{})[t.n]||{};
  let ck='';
  if(d.steps){ d.steps.forEach((s,i)=>{
    if(typeof s==='string') ck+=`<label><input type="checkbox" data-k="${i}" ${st[i]?'checked':''}><span>${esc(s)}</span></label>`;
    else { ck+=`<div class="gh"><span class="num" style="background:${a.color}">${i+1}</span>${esc(s.t)}</div>`;
      (s.s||[]).forEach((y,j)=>{const k=i+'.'+j; ck+=`<label class="sub"><input type="checkbox" data-k="${k}" ${st[k]?'checked':''}><span>${esc(y)}</span></label>`;}); }
  }); } else ck+=`<label><input type="checkbox" data-k="0" ${st['0']?'checked':''}><span>${esc(t.n)} 완료했어요</span></label>`;
  const help=t.bk?`막히면 → <b>${esc(t.bk)}</b> (백업)`:t.o==='시스템'?`시스템 오류면 → <b>${esc(a.lead)}</b>`:t.o!==a.lead?`막히면 → <b>${esc(a.lead)}</b> (영역 담당)`:`막히면 → <b>슬랙 #운영 채널</b>`;
  let h=`<div class="md-badges">${badges(t)}</div>
    <div class="why">🎯 <b>왜 하나요?</b> ${esc(d.why||a.why)}</div>`;
  if(d.where) h+=`<div class="sec"><h4>📍 어디서 해요?</h4>${d.where.map(w=>`<a class="lnk" href="${w.u}" target="_blank" rel="noopener">🔗 ${esc(w.t)}</a>`).join('')}</div>`;
  h+=`<div class="sec"><h4>☑️ 이렇게 해요 — 하면서 체크 <span class="pct" id="pct"></span></h4><div class="prog"><i id="pbar"></i></div><div class="ck" id="ck">${ck}</div></div>`;
  if(d.img) h+=`<div class="sec"><h4>🖼️ 실제 화면 (클릭하면 크게)</h4><div class="imgs">${d.img.map(m=>`<figure class="img" data-f="${m.f}" data-c="${esc(m.c)}"><img src="${IMG+m.f}" alt="${esc(m.c)}" loading="lazy"><figcaption>${esc(m.c)}</figcaption></figure>`).join('')}</div></div>`;
  h+=`<div class="sec"><div class="wb wb-done">✅ 이게 되면 끝: ${esc(d.done||'시트·홈버튼에 결과가 기록되어 있으면 끝이에요.')}</div>`;
  if(d.warn) h+=[].concat(d.warn).map(w=>`<div class="wb wb-warn">⚠️ ${esc(w)}</div>`).join('');
  if(d.tip) h+=[].concat(d.tip).map(w=>`<div class="wb wb-tip">💡 ${esc(w)}</div>`).join('');
  h+=`</div><div class="sec help">🆘 ${help}</div>`;
  if(d.next&&byName[d.next]) h+=`<button class="nextbtn" data-n="${esc(d.next)}" style="background:${a.color}">⏭ 다음 단계: ${byName[d.next].t.e} ${esc(d.next)} →</button>`;
  const b=document.getElementById('mdb'); b.innerHTML=h; b.scrollTop=0;
  updProg(); document.getElementById('ov').classList.add('on'); document.body.style.overflow='hidden';
}
function updProg(){
  const boxes=[...document.querySelectorAll('#ck input')]; const n=boxes.filter(b=>b.checked).length;
  document.getElementById('pct').textContent=`${n} / ${boxes.length}${n===boxes.length&&boxes.length?' 🎉 완료!':''}`;
  document.getElementById('pbar').style.width=(boxes.length?n/boxes.length*100:0)+'%';
}
document.getElementById('mdb').addEventListener('change',e=>{
  if(e.target.type!=='checkbox'||!CUR) return;
  const all=LS.get(chkKey(),{}); const st=all[CUR.n]||{}; st[e.target.dataset.k]=e.target.checked; all[CUR.n]=st; LS.set(chkKey(),all); updProg();
});
document.getElementById('mdb').addEventListener('click',e=>{
  const nb=e.target.closest('.nextbtn'); if(nb){openModal(nb.dataset.n);return}
  const f=e.target.closest('.img'); if(f){document.getElementById('lbi').src=IMG+f.dataset.f;document.getElementById('lbc').textContent=f.dataset.c;document.getElementById('lb').classList.add('on');}
});
document.getElementById('mdr').onclick=()=>{ if(!CUR) return; const all=LS.get(chkKey(),{}); delete all[CUR.n]; LS.set(chkKey(),all); openModal(CUR.n); };
function closeModal(){ document.getElementById('ov').classList.remove('on'); document.body.style.overflow=''; CUR=null; renderWho(); }
document.getElementById('mdx').onclick=closeModal;
document.getElementById('ov').onclick=e=>{ if(e.target.id==='ov') closeModal(); };
document.getElementById('lb').onclick=()=>document.getElementById('lb').classList.remove('on');
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; const lb=document.getElementById('lb'); if(lb.classList.contains('on')) lb.classList.remove('on'); else closeModal(); });

/* ── init ── */
renderWho(); renderFlow(); renderAll();
(()=>{const v=LS.get('krg_tab','me'); const b=document.querySelector(`.tab[data-v="${v}"]`); if(b&&!b.classList.contains('on')) b.click();})();
if(location.hash){const el=document.querySelector(location.hash); if(el){const v=el.closest('.view'); if(v){document.querySelector(`.tab[data-v="${v.id.slice(2)}"]`).click(); el.scrollIntoView();}}}
</script>
</body>
</html>
