<style>
:root{

  --t1:#6FCF9E; --t2:#F2C879; --t3:#E8938C; --accent:#6ECDC2;
  --mono:'SF Mono',ui-monospace,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(1200px 800px at 18% 30%, #144743 0%, var(--canvas) 55%, var(--canvas-2) 100%);
  color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{padding:16px 22px 10px;display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;border-bottom:1px solid rgba(110,205,194,.18)}
h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--accent)}
.meta{font-family:var(--mono);font-size:11px;color:var(--sub)}
.controls{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{background:rgba(244,248,247,.08);border:1px solid rgba(110,205,194,.35);color:var(--ink);
  font-size:11.5px;padding:5px 11px;border-radius:99px;cursor:pointer;font-family:inherit}
button:hover{background:rgba(110,205,194,.18)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.gchip{font-family:var(--mono);font-weight:700}
button.gchip.off{opacity:.35}
.g1{border-color:var(--t1);color:var(--t1)} .g2{border-color:var(--t2);color:var(--t2)} .g3{border-color:var(--t3);color:var(--t3)}
.legend{padding:6px 22px;font-size:11px;color:var(--sub);display:flex;gap:16px;flex-wrap:wrap}
.legend b{color:var(--ink);font-weight:600}
#map{flex:1;cursor:grab}
#map:active{cursor:grabbing}
.link{fill:none;stroke:var(--link);stroke-width:1.3px}
.node-card{cursor:pointer}
.node-card rect{fill:var(--node);rx:7px}
.node-card.depth0 rect{fill:var(--accent)}
.node-card.depth1 rect{fill:#DCEBE8}
.node-card.depth2 rect{fill:#C7DDD9}
.node-card text{fill:var(--node-ink);font-size:12px;font-weight:600;pointer-events:none}
.node-card .cnt{font-family:var(--mono);font-size:10px;font-weight:700;fill:#3E6B66}
.node-card .dirb{font-family:var(--mono);font-size:9px;font-weight:800;fill:#28524D}
.node-card circle.dot{stroke:none}
.node-card .chev{fill:#3E6B66;font-size:10px;font-weight:800}
.node-card.dim{opacity:.22}
@media (prefers-reduced-motion: reduce){ .anim *{transition:none !important} }
footer{padding:6px 22px 10px;font-size:10.5px;color:var(--sub);font-family:var(--mono)}
</style>
</head>

const svg = d3.select('#map');
const g = svg.append('g').attr('class','anim');
const zoom = d3.zoom().scaleExtent([.3, 2.5]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

const GC = {T1:'#6FCF9E', T2:'#F2C879', T3:'#E8938C'};
let root = d3.hierarchy(DATA);
root.descendants().forEach((d,i) => { d.id = i; d._children = d.children; });
// 초기: 대응자(depth2)까지만
root.descendants().forEach(d => { if (d.depth >= 2) d.children = null; });

const dy = 250, dx = 30;
const treeLayout = d3.tree().nodeSize([dx, dy]);
let activeGrades = new Set();

function nodeW(d){
  const base = d.data.name.length * 12 + 46;
  return Math.min(Math.max(base + (d.depth===1?52:0) + (d.data.cnt?34:0), 90), 330);
}
function update(source){
  treeLayout(root);
  let x0 = Infinity, x1 = -Infinity;
  root.each(d => { if (d.x < x0) x0 = d.x; if (d.x > x1) x1 = d.x; });
  const H = Math.max(window.innerHeight - 150, x1 - x0 + 80);
  svg.attr('viewBox', null);

  const nodes = root.descendants(), links = root.links();

  const link = g.selectAll('path.link').data(links, d => d.target.id);
  link.enter().append('path').attr('class','link')
    .merge(link)
    .transition().duration(280)
    .attr('d', d3.linkHorizontal().x(d => d.y).y(d => d.x));
  link.exit().remove();

  const node = g.selectAll('g.node-card').data(nodes, d => d.id);
  const ne = node.enter().append('g')
    .attr('class', d => 'node-card depth' + d.depth)
    .attr('transform', d => `translate(${source ? source.y : d.y},${source ? source.x : d.x})`)
    .on('click', (e,d) => { if (d._children){ d.children = d.children ? null : d._children; update(d); } });

  ne.append('rect').attr('y', -12).attr('height', 24).attr('rx', 7);
  ne.append('circle').attr('class','dot').attr('r', 4.5).attr('cx', 13).attr('cy', 0)
    .style('display', d => d.data.grade ? null : 'none')
    .attr('fill', d => GC[d.data.grade] || 'none');
  ne.append('text').attr('class','label').attr('dy', 4);
  ne.append('text').attr('class','cnt').attr('dy', 4);
  ne.append('text').attr('class','dirb').attr('dy', 4).attr('x', 10)
    .text(d => d.depth===1 && d.data.dir ? (d.data.dir==='수신' ? '⬇ 수신' : d.data.dir==='발신' ? '⬆ 발신' : '· 미지정') : '');
  ne.append('text').attr('class','chev').attr('dy', 4);

  const all = ne.merge(node);
  all.transition().duration(280).attr('transform', d => `translate(${d.y},${d.x})`);
  all.select('rect').attr('width', d => nodeW(d)).attr('x', 0);
  all.select('text.label')
    .attr('x', d => d.data.grade ? 24 : (d.depth===1 ? 58 : 12))
    .text(d => d.data.name);
  all.select('text.cnt')
    .attr('x', d => nodeW(d) - (d._children ? 30 : 12)).attr('text-anchor','end')
    .text(d => d.data.cnt ? d.data.cnt + '건' : '');
  all.select('text.chev')
    .attr('x', d => nodeW(d) - 16)
    .text(d => d._children ? (d.children ? '−' : '+') : '');
  all.classed('dim', d => activeGrades.size && d.data.grade && !activeGrades.has(d.data.grade));
  node.exit().transition().duration(200)
    .attr('transform', d => `translate(${source ? source.y : d.y},${source ? source.x : d.x})`)
    .style('opacity', 0).remove();
}
function fit(){
  const b = g.node().getBBox();
  const W = svg.node().clientWidth, H = svg.node().clientHeight;
  const s = Math.min(W / (b.width + 80), H / (b.height + 60), 1.4);
  const t = d3.zoomIdentity.translate(W/2 - s*(b.x + b.width/2), H/2 - s*(b.y + b.height/2)).scale(s);
  svg.transition().duration(350).call(zoom.transform, t);
}
update(); setTimeout(fit, 320);

document.getElementById('expand').onclick = () => {
  root.descendants().forEach(d => { if (d._children) d.children = d._children; });
  update(); setTimeout(fit, 320);
};
document.getElementById('collapse').onclick = () => {
  root.descendants().forEach(d => { if (d.depth >= 2) d.children = null; else if (d._children) d.children = d._children; });
  update(); setTimeout(fit, 320);
};
document.querySelectorAll('.gchip').forEach(b => b.onclick = () => {
  const gr = b.dataset.g;
  if (activeGrades.has(gr)) { activeGrades.delete(gr); b.classList.add('off'); }
  else { activeGrades.add(gr); b.classList.remove('off'); }
  if (![...document.querySelectorAll('.gchip')].some(x => !x.classList.contains('off') && activeGrades.has(x.dataset.g)) && activeGrades.size===0){}
  update();
});
window.addEventListener('resize', () => update());
</script>
