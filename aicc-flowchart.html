"강휘수·이지희"}, {"dir": "내부", "tRaw": "KRG", "targets": ["내부·기타"], "task": "서류 보관 종결·신분증 폐기 (30일)", "ch": "NAS", "cycle": "건별", "actor": "human", "hand": "고송미"}, {"dir": "내부", "tRaw": "KRG", "targets": ["내부·기타"], "task": "연체·응대 이력 종결 기록", "ch": "노션·운영웹", "cycle": "건별", "actor": "ai", "hand": "예외건 → 각 담당"}]}];
const AICON = {ai:'🤖', mix:'🤝', human:'👤', ban:'👤'};
const TORDER = ['임대인','임(전)차인','부동산','내부·기타'];
const state = {actors:new Set(), targets:new Set(), mode:'target'};
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

function match(it){
  const aOK = !state.actors.size || state.actors.has(it.actor);
  const tOK = !state.targets.size || it.targets.some(t => state.targets.has(t));
  return aOK && tOK;
}
function itemHTML(it){
  const hand = it.hand ? `<span class="hand">${esc(it.hand)}</span>` : '';
  const cyc = it.cycle ? `<span class="cyc">${esc(it.cycle)}</span>` : '';
  return `<li class="${it.actor}${match(it)?'':' dim'}"><span class="ic">${AICON[it.actor]}</span><div class="tx"><div class="t1"><span class="dirb ${it.dir}">${it.dir}</span>${esc(it.task)} ${cyc}</div>${hand}</div></li>`;
}
function groupHTML(label, items){
  const hasAI = items.some(i => i.actor==='ai'||i.actor==='mix');
  const allDim = items.every(i => !match(i));
  return `<div class="grp ${hasAI?'aicc':'plain'}${allDim?' dim':''}"><div class="glabel">${esc(label)} <em>${items.length}건</em></div><ul>${items.map(itemHTML).join('')}</ul></div>`;
}
function render(){
  const top = [], bot = [], spine = [];
  let shown = 0;
  STAGES.forEach((st, si) => {
    st.items.forEach(it => { if (match(it)) shown++; });
    let groups;
    if (state.mode === 'target'){
      groups = TORDER.map(t => [t, st.items.filter(i => i.targets.includes(t))]).filter(g => g[1].length);
    } else {
      groups = ['수신','발신','내부'].map(d => [d==='내부'?'내부 업무':'AICC : '+d, st.items.filter(i => i.dir===d)]).filter(g => g[1].length);
    }
    const tree = `<div class="tree"><div class="stitle">${st.icon} ${esc(st.name)}<span>${esc(st.sub)} · ${st.items.length}건</span></div>${groups.map(g=>groupHTML(g[0],g[1])).join('')}</div>`;
    const pos = si % 2 === 0 ? 'up' : 'down';
    top.push(`<div class="cell">${pos==='up'?tree:''}</div>`);
    bot.push(`<div class="cell">${pos==='down'?tree:''}</div>`);
    spine.push(`<div class="dot ${pos}"><b>${st.icon}</b>${esc(st.name.split(' ').slice(1).join(' ')||st.name)}</div>`);
  });
  document.getElementById('gtop').innerHTML = top.join('');
  document.getElementById('gbot').innerHTML = bot.join('');
  document.getElementById('spine').innerHTML = spine.join('');
  const total = STAGES.reduce((s,x)=>s+x.items.length,0);
  document.getElementById('cnt').textContent = (state.actors.size||state.targets.size) ? `표시 ${shown} / ${total}건` : `전체 ${total}건`;
}
document.querySelectorAll('button.f').forEach(b => b.onclick = () => {
  const vals = b.dataset.v.split(','), set = b.classList.contains('actor') ? state.actors : state.targets;
  const on = b.classList.toggle('on');
  vals.forEach(v => on ? set.add(v) : set.delete(v));
  render();
});
document.getElementById('mode').onclick = e => {
  state.mode = state.mode === 'target' ? 'dir' : 'target';
  e.target.textContent = state.mode === 'target' ? '대상별 ▾' : '방향별 ▾';
  render();
};
document.getElementById('reset').onclick = () => {
  state.actors.clear(); state.targets.clear();
  document.querySelectorAll('button.f.on').forEach(b => b.classList.remove('on'));
  render();
};
render();
</script>
